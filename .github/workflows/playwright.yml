name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  playwright:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json

      # playwright.config.ts webServer runs `flutter run` from the repo root
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # .env is a bundled Flutter asset (pubspec.yaml) but gitignored
      - name: Create app .env
        run: |
          [ -n "${{ secrets.SUPABASE_URL }}" ] || echo "::warning::SUPABASE_URL secret is not set; login tests will fail"
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "OPENAI_API_KEY="
          } > .env

      - name: Install Flutter dependencies
        run: flutter pub get

      # A release bundle renders in seconds; `flutter run` compiles on first request and
      # outlasted the test timeouts on runners
      - name: Build web app
        run: flutter build web --release

      - name: Install dependencies
        run: cd playwright && npm ci

      - name: Install Playwright browser
        run: cd playwright && npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: cd playwright && npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          WEB_SERVER_CMD: python3 -m http.server 8080 --directory build/web
          BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:8080' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # The raw report records typed text (the test password) and its traces hold session
      # tokens. This repo is public, so only a sanitized copy is uploaded or published; the
      # script fails if anything secret-looking is left.
      - name: Sanitize report
        id: sanitize
        if: always() && hashFiles('playwright/playwright-report/index.html') != ''
        run: python3 -I playwright/sanitize-report.py playwright/playwright-report public-report
        env:
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && steps.sanitize.outcome == 'success'
        with:
          name: playwright-report-${{ matrix.browser }}
          path: public-report/
          retention-days: 30

      - name: Upload report for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: >-
          always() && steps.sanitize.outcome == 'success' && matrix.browser == 'chromium'
          && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: public-report/

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.browser }}
          path: playwright/playwright-report/screenshots/
          retention-days: 7

  # Publishes the latest main report to GitHub Pages, failures included.
  # Needs Settings → Pages → Source: "GitHub Actions".
  report:
    name: Publish report
    needs: playwright
    if: >-
      always() && needs.playwright.result != 'cancelled'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Link report in run summary
        run: echo "### 📊 [Playwright report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
