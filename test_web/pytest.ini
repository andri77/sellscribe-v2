[pytest]
# Pytest Configuration for SellScribe Playwright Tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options
addopts =
    -v
    --tb=short
    --strict-markers

# Markers
markers =
    smoke: mark test as smoke test (quick sanity checks)
    regression: mark test as regression test (full test suite)
    login: mark test as login related
    register: mark test as registration related
    listing: mark test as listing related
    settings: mark test as settings related
    profile: mark test as profile related

# Timeout (in seconds)
timeout = 120

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s - %(levelname)s - %(message)s

# Report
junit_family = xunit2
