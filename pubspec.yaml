name: sellscribe
description: AI-powered product listing generator for Shopify sellers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Image handling
  image_picker: ^1.0.7
  image_picker_for_web: ^3.0.2

  # Environment variables
  flutter_dotenv: ^5.1.0

  # HTTP requests
  http: ^1.2.0

  # Utilities
  clipboard: ^0.1.3
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  uuid: ^4.3.3
  intl: ^0.19.0

  # UI
  flutter_spinkit: ^5.2.0
  file_picker: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - .env
